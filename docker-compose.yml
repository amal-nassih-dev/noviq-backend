services:
  postgres:
    image: postgres:16
    container_name: postgres-noviq
    environment:
      POSTGRES_USER: noviq
      POSTGRES_PASSWORD: noviq
      POSTGRES_DB: noviq
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U noviq -d noviq"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
