spring.application.name=noviq

spring.datasource.url=jdbc:postgresql://localhost:5432/noviq
spring.datasource.username=noviq
spring.datasource.password=noviq

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true

server.port=8081

jwt.secret=${JWT_SECRET:THIS_IS_ONLY_A_LOCAL_DEVELOPMENT_SECRET_KEY_12345678901234567890}
jwt.expiration=${JWT_EXPIRATION:86400000}